name: Docs copy check

on:
  push:
    branches: [main]
    paths:
      - "tui/**"
      - "bin/**"
      - "helpers/**"
      - "bar_module/**"
      - "config/**"
      - "lua/**"
      - "BarWidget.qml"
      - "docs/index.html"
      - "scripts/check_copy.py"
      - ".github/workflows/docs-copy-check.yml"
  pull_request:
    paths:
      - "tui/**"
      - "bin/**"
      - "helpers/**"
      - "bar_module/**"
      - "config/**"
      - "lua/**"
      - "BarWidget.qml"
      - "docs/index.html"
      - "scripts/check_copy.py"
      - ".github/workflows/docs-copy-check.yml"

jobs:
  check:
    name: Page copy ↔ source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs/index.html against the source
        run: python3 scripts/check_copy.py
