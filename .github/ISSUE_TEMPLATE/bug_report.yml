name: 🐛 Bug Report
description: File a bug or unexpected behavior report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to replicate the behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Hyprland version, Ghostty version, and Omarchy environment details.
      value: |
        - Hyprland: v0.55+ (Lua config)
        - Ghostty version: 
        - Omarchy Shell version:
    validations:
      required: true
